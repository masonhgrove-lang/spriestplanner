<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WoW: Forever - Shadow Priest Upgrade Finder</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #16151f;
      --card: #1f1d2b;
      --card-highlight: #28243d;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2e2b42;
      --success: #4ade80;
      --warning: #fbbf24;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    h1 { margin: 0 0 6px 0; color: var(--accent); }
    .subtitle { color: var(--muted); margin: 0 0 16px 0; font-size: 0.95rem; }
    .summary-bar { display: flex; gap: 12px; flex-wrap: wrap; }
    .badge {
      background: var(--panel);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
    }
    .panel h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .slot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .slot-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .slot-name { font-weight: bold; color: #a78bfa; width: 85px; flex-shrink: 0; }
    .item-display { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { color: var(--muted); font-style: italic; }
    .ep-tag {
      background: #312e81;
      color: #c7d2fe;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .slot-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .card-immediate {
      background: var(--card-highlight);
      border: 2px solid var(--accent);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .card-badge {
      font-size: 0.75rem;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .card-title { font-weight: bold; color: #c4b5fd; }
    .source-text { font-size: 0.8rem; color: var(--muted); }
    .ep-text { font-size: 0.85rem; margin-top: 6px; }
    .delta-plus { color: var(--success); font-weight: bold; }
    
    button {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.btn-secondary {
      background: #334155;
    }
    button.btn-secondary:hover {
      background: #475569;
    }
    a { color: #c4b5fd; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-header h3 { margin: 0; color: var(--accent); }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .modal-list {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .modal-item-info { font-size: 0.9rem; }
    .modal-item-sub { font-size: 0.75rem; color: var(--muted); }
  </style>
  <script>const whTooltips = { colorLinks: true, iconizeLinks: true, renameLinks: true };</script>
  <script src="https://wow.zamimg.com/js/tooltips.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Shadow Priest Gear Optimizer</h1>
      <p class="subtitle">WoW Forever Edition • Search items across levels 1–60 • Instant Closest Upgrade Finder</p>
      <div id="stat-summary" class="summary-bar"></div>
    </header>

    <div class="layout">
      <!-- Equipped Gear Panel -->
      <section class="panel">
        <h2>Equipped Loadout</h2>
        <div id="equipment-slots"></div>
      </section>

      <!-- Upgrades Inspection Panel -->
      <section class="panel">
        <h2 id="upgrades-title">Upgrade Advisor</h2>
        <div id="upgrade-results">
          <p style="color: var(--muted);">Select or change any slot on the left to see your next closest upgrade.</p>
        </div>
      </section>
    </div>
  </div>

  <!-- Item Search Modal -->
  <div id="search-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Select Item</h3>
        <button onclick="closeModal()" class="btn-secondary">✕</button>
      </div>
      <input type="text" id="modal-search-box" class="search-input" placeholder="Type to search items by name or source..." oninput="filterModalItems()">
      <div id="modal-item-list" class="modal-list"></div>
    </div>
  </div>
