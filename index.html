<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WoW: Forever - Shadow Priest Gear & Upgrade Advisor</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #16151f;
      --card: #1f1d2b;
      --card-highlight: #241e38;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2e2b42;
      --success: #4ade80;
      --warning: #fbbf24;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
    }
    .container { max-width: 1250px; margin: 0 auto; }
    header { border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    h1 { margin: 0 0 6px 0; color: var(--accent); }
    .subtitle { color: var(--muted); margin: 0 0 16px 0; font-size: 0.95rem; }
    .summary-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .badge {
      background: var(--panel);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }

    /* Quick Search Top Bar */
    .quick-search-box {
      margin-top: 14px;
      position: relative;
    }
    .quick-search-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }
    .quick-search-input:focus { outline: none; box-shadow: 0 0 8px rgba(139, 92, 246, 0.5); }
    .search-results-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 0 0 6px 6px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    .search-result-row {
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .search-result-row:hover { background: var(--card); }

    /* Main Grid */
    .layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; margin-top: 20px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .panel-header h2 { margin: 0; font-size: 1.25rem; }

    /* Slot Card Styles */
    .slot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 10px;
      transition: border-color 0.15s ease;
    }
    .slot-card.active-slot {
      border-color: var(--accent);
      background: var(--card-highlight);
    }
    .slot-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .slot-badge-name {
      font-weight: 700;
      color: #c4b5fd;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .equipped-details {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
    }
    .ep-tag {
      background: #312e81;
      color: #c7d2fe;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-clear {
      background: transparent;
      border: 1px solid #475569;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-clear:hover { background: #ef4444; color: white; border-color: #ef4444; }

    /* In-Slot Selector Dropdown */
    .slot-select-picker {
      width: 100%;
      background: #0f0e17;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.85rem;
      margin-top: 6px;
      cursor: pointer;
    }
    .slot-select-picker:focus { outline: none; border-color: var(--accent); }

    /* Upgrade Panel Cards */
    .upgrade-target-box {
      background: var(--card-highlight);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .target-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .target-badge {
      background: var(--accent);
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .target-name { font-size: 1.1rem; font-weight: bold; }
    .source-info { font-size: 0.85rem; color: var(--muted); margin: 4px 0; }
    .ep-gain {
      font-size: 0.95rem;
      color: var(--success);
      font-weight: bold;
      margin-top: 6px;
    }

    .later-upgrades-list { display: flex; flex-direction: column; gap: 8px; }
    .later-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button.btn-primary {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-primary:hover { background: var(--accent-hover); }

    a { color: #c4b5fd; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }

    /* Custom Item Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      padding: 20px;
    }
    .modal-field { margin-bottom: 12px; }
    .modal-field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .modal-field input, .modal-field select {
      width: 100%;
      padding: 8px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
    }
  </style>

</head>
<body>
  <div class="container">
    <header>
      <h1>Shadow Priest Gear & Upgrade Advisor</h1>
      <p class="subtitle">WoW Forever Edition • Select any item to view your next immediate upgrade</p>
      
      <!-- Stats Banner -->
      <div id="stat-summary" class="summary-bar"></div>

      <!-- Quick Finder Across All Items -->
      <div class="quick-search-box">
        <input 
          type="text" 
          id="global-search" 
          class="quick-search-input" 
          placeholder="🔍 Fast Search: Type any WoW Forever item name to equip directly..." 
          oninput="handleGlobalSearch()"
        >
        <div id="global-search-results" class="search-results-dropdown"></div>
      </div>
    </header>

    <div class="layout">
      <!-- Equipped Gear Roster -->
      <section class="panel">
        <div class="panel-header">
          <h2>Equipped Loadout</h2>
          <button class="btn-clear" onclick="openCustomModal()">+ Add Custom Item</button>
        </div>
        <div id="equipment-slots"></div>
      </section>

      <!-- Dynamic Upgrade Panel -->
      <section class="panel">
        <div class="panel-header">
          <h2 id="upgrades-title">Next Available Upgrade</h2>
        </div>
        <div id="upgrade-results">
          <p style="color: var(--muted);">Select or change any gear slot on the left to inspect its upgrades.</p>
        </div>
      </section>
    </div>
  </div>

  <!-- Custom Item Modal -->
  <div id="custom-modal" class="modal-overlay">
    <div class="modal">
      <h3 style="margin-top:0; color:var(--accent);">Add Custom WoW Forever Item</h3>
      <div class="modal-field">
        <label>Item Name</label>
        <input type="text" id="cust-name" placeholder="e.g. Robe of the Shadow Flayer">
      </div>
      <div class="modal-field">
        <label>Gear Slot</label>
        <select id="cust-slot">
          <option value="Head">Head</option>
          <option value="Neck">Neck</option>
          <option value="Shoulder">Shoulder</option>
          <option value="Back">Back</option>
          <option value="Chest">Chest</option>
          <option value="Wrist">Wrist</option>
          <option value="Hands">Hands</option>
          <option value="Waist">Waist</option>
          <option value="Legs">Legs</option>
          <option value="Feet">Feet</option>
          <option value="Ring">Ring</option>
          <option value="Trinket">Trinket</option>
          <option value="MainHand">MainHand / 2H Staff</option>
          <option value="OffHand">OffHand</option>
          <option value="Wand">Wand</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Required Level</label>
        <input type="number" id="cust-lvl" value="60">
      </div>
      <div class="modal-field">
        <label>Spell Power / Shadow Power</label>
        <input type="number" id="cust-sp" value="0">
      </div>
      <div class="modal-field">
        <label>Spell Hit %</label>
        <input type="number" id="cust-hit" value="0">
      </div>
      <div class="modal-field">
        <label>Spell Crit %</label>
        <input type="number" id="cust-crit" value="0">
      </div>
      <div class="modal-field">
        <label>Intellect</label>
        <input type="number" id="cust-int" value="0">
      </div>
      <div class="modal-field">
        <label>Source / Drop Location</label>
        <input type="text" id="cust-src" placeholder="e.g. New Forever Dungeon / World Boss">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
        <button class="btn-clear" onclick="closeCustomModal()">Cancel</button>
        <button class="btn-primary" onclick="saveCustomItem()">Save & Equip</button>
      </div>
    </div>
  </div>

    ];

    // Load any saved custom items
    const customSaved = JSON.parse(localStorage.getItem("spriest_custom_items") || "[]");
    ITEMS = [...ITEMS, ...customSaved];

    let equipped = JSON.parse(localStorage.getItem("spriest_gear_v3")) || {
      "Head": 7720,
      "Chest": 6341,
      "MainHand": 2042,
      "Wand": 7001
    };

    let activeSelectedSlot = "Head";

    function computeStats() {
      let sp = 0, hit = 0, crit = 0, int = 0, spi = 0;
      Object.values(equipped).forEach(id => {
        const item = ITEMS.find(i => i.id === id);
        if (item && item.stats) {
          sp += item.stats.sp || 0;
          hit += item.stats.hit || 0;
          crit += item.stats.crit || 0;
          int += item.stats.int || 0;
          spi += item.stats.spi || 0;
        }
      });
      return { sp, hit, crit, int, spi };
    }

    // Shadow Priest EP formula with leveling Int & Spirit utility
    function calculateEP(item, currentTotalHit, equippedItemHit = 0) {
      if (!item || !item.stats) return 0;
      const otherHit = currentTotalHit - equippedItemHit;
      const effectiveHit = Math.max(0, Math.min(item.stats.hit || 0, GEAR_HIT_CAP - otherHit));
      
      return (
        ((item.stats.sp || 0) * 1.0) +
        (effectiveHit * 1.15) +
        ((item.stats.crit || 0) * 0.85) +
        ((item.stats.int || 0) * 0.25) +
        ((item.stats.spi || 0) * 0.20)
      );
    }

    function render() {
      const stats = computeStats();
      const hitColor = stats.hit >= GEAR_HIT_CAP ? "var(--success)" : "var(--warning)";
      document.getElementById("stat-summary").innerHTML = `
        <div class="badge">Spell Power: <strong>+${stats.sp}</strong></div>
        <div class="badge" style="color: ${hitColor}">Hit: <strong>${stats.hit}% / ${GEAR_HIT_CAP}%</strong> ${stats.hit >= GEAR_HIT_CAP ? '(Capped)' : `(Need +${GEAR_HIT_CAP - stats.hit}%)`}</div>
        <div class="badge">Crit: <strong>+${stats.crit}%</strong></div>
        <div class="badge">Intellect: <strong>${stats.int}</strong></div>
        <div class="badge">Spirit: <strong>${stats.spi}</strong></div>
      `;

      const container = document.getElementById("equipment-slots");
      container.innerHTML = "";

      SLOTS.forEach(slot => {
        const baseSlot = slot.replace(/[0-9]/g, "");
        const itemId = equipped[slot];
        const currentItem = ITEMS.find(i => i.id === itemId);
        const currentItemHit = currentItem?.stats?.hit || 0;
        const ep = currentItem ? calculateEP(currentItem, stats.hit, currentItemHit).toFixed(1) : 0;
        const isActive = slot === activeSelectedSlot;

        // Available items for this slot dropdown
        const slotItems = ITEMS
          .filter(i => i.slot === baseSlot)
          .sort((a, b) => (a.reqLvl || 1) - (b.reqLvl || 1));

        const card = document.createElement("div");
        card.className = `slot-card ${isActive ? 'active-slot' : ''}`;
        card.onclick = (e) => {
          if (e.target.tagName !== "SELECT" && e.target.tagName !== "BUTTON" && e.target.tagName !== "A") {
            selectSlot(slot);
          }
        };

        let optionsHtml = `<option value="">— Select gear to equip in this slot —</option>`;
        slotItems.forEach(i => {
          const selected = i.id === itemId ? "selected" : "";
          optionsHtml += `<option value="${i.id}" ${selected}>[Lvl ${i.reqLvl || 1}] ${i.name} (${i.source})</option>`;
        });

        card.innerHTML = `
          <div class="slot-card-top">
            <span class="slot-badge-name">${slot}</span>
            ${currentItem ? `<button class="btn-clear" onclick="clearSlot('${slot}', event)">✕ Unequip</button>` : ''}
          </div>
          <div class="equipped-details">
            ${currentItem 
              ? `<a href="https://www.wowhead.com/classic/item=${currentItem.id}" data-wowhead="item=${currentItem.id}">${currentItem.name}</a>
                 <span class="ep-tag">${ep} EP</span>` 
              : `<span style="color:var(--muted); font-style:italic;">Nothing Equipped</span>`}
          </div>
          <select class="slot-select-picker" onchange="equipSlotFromSelect('${slot}', this.value)">
            ${optionsHtml}
          </select>
        `;

        container.appendChild(card);
      });

      if (window.$WowheadPower) window.$WowheadPower.refreshLinks();
      renderUpgradeAdvisor();
    }

    function selectSlot(slot) {
      activeSelectedSlot = slot;
      render();
    }

    function equipSlotFromSelect(slot, itemIdStr) {
      activeSelectedSlot = slot;
      if (!itemIdStr) {
        delete equipped[slot];
      } else {
        equipped[slot] = isNaN(itemIdStr) ? itemIdStr : parseInt(itemIdStr);
      }
      saveEquipped();
      render();
    }

    function clearSlot(slot, e) {
      if (e) e.stopPropagation();
      delete equipped[slot];
      activeSelectedSlot = slot;
      saveEquipped();
      render();
    }

    function saveEquipped() {
      localStorage.setItem("spriest_gear_v3", JSON.stringify(equipped));
    }

    // Dynamic Upgrade Advisor logic
    function renderUpgradeAdvisor() {
      const slot = activeSelectedSlot;
      const baseSlot = slot.replace(/[0-9]/g, "");
      const stats = computeStats();
      const currentItem = ITEMS.find(i => i.id === equipped[slot]);
      const currentItemHit = currentItem ? (currentItem.stats?.hit || 0) : 0;
      const currentEP = currentItem ? calculateEP(currentItem, stats.hit, currentItemHit) : 0;

      document.getElementById("upgrades-title").innerText = `Upgrade Advisor: ${slot}`;
      const list = document.getElementById("upgrade-results");
      list.innerHTML = "";

      const upgrades = ITEMS
        .filter(i => i.slot === baseSlot && i.id !== (currentItem ? currentItem.id : null))
        .map(i => {
          const ep = calculateEP(i, stats.hit, currentItemHit);
          return { ...i, ep, delta: ep - currentEP };
        })
        .filter(i => i.delta > 0)
        .sort((a, b) => a.delta - b.delta); // Closest upgrade first

      if (upgrades.length === 0) {
        list.innerHTML = `
          <div style="padding: 16px; background: var(--card); border-radius: 6px;">
            <p style="margin: 0; color: var(--muted);">
              ${currentItem ? `You currently have <strong>${currentItem.name}</strong> equipped. No higher power upgrades exist in the database for this slot!` : 'No item equipped. Select an item from the left to view upgrades.'}
            </p>
          </div>
        `;
        return;
      }

      // 1. Closest next upgrade
      const immediate = upgrades[0];
      const immediateBox = document.createElement("div");
      immediateBox.className = "upgrade-target-box";
      immediateBox.innerHTML = `
        <div class="target-banner">
          <span class="target-badge">🎯 NEXT CLOSEST UPGRADE</span>
          <button class="btn-primary" onclick="equipSlotFromSelect('${slot}', ${immediate.id})">Equip This</button>
        </div>
        <div class="target-name">
          <a href="https://www.wowhead.com/classic/item=${immediate.id}" data-wowhead="item=${immediate.id}">${immediate.name}</a>
        </div>
        <div class="source-info">Requires Level: ${immediate.reqLvl || 1} • Source: ${immediate.source}</div>
        <div class="ep-gain">Power Gain: +${immediate.delta.toFixed(1)} EP (${immediate.ep.toFixed(1)} total EP)</div>
      `;
      list.appendChild(immediateBox);

      // 2. Later upgrades in progression
      if (upgrades.length > 1) {
        const title = document.createElement("h4");
        title.style.color = "var(--muted)";
        title.style.margin = "16px 0 8px 0";
        title.innerText = "Later Progression Upgrades:";
        list.appendChild(title);

        const laterContainer = document.createElement("div");
        laterContainer.className = "later-upgrades-list";

        upgrades.slice(1).forEach(u => {
          const row = document.createElement("div");
          row.className = "later-card";
          row.innerHTML = `
            <div>
              <div><a href="https://www.wowhead.com/classic/item=${u.id}" data-wowhead="item=${u.id}">${u.name}</a></div>
              <div class="source-info">Lvl ${u.reqLvl || 1} • ${u.source}</div>
              <div style="font-size:0.85rem; color:var(--success);">+${u.delta.toFixed(1)} EP gain</div>
            </div>
            <button class="btn-primary" style="font-size:0.8rem; padding:4px 10px;" onclick="equipSlotFromSelect('${slot}', ${u.id})">Equip</button>
          `;
          laterContainer.appendChild(row);
        });

        list.appendChild(laterContainer);
      }

      if (window.$WowheadPower) window.$WowheadPower.refreshLinks();
    }

    // Universal Quick Search Bar
    function handleGlobalSearch() {
      const q = document.getElementById("global-search").value.toLowerCase().trim();
      const resultsBox = document.getElementById("global-search-results");

      if (!q) {
        resultsBox.style.display = "none";
        return;
      }

      const matches = ITEMS.filter(i => 
        i.name.toLowerCase().includes(q) || i.source.toLowerCase().includes(q)
      ).slice(0, 8);

      if (matches.length === 0) {
        resultsBox.innerHTML = `<div style="padding:10px; color:var(--muted); text-align:center;">No matching items found</div>`;
        resultsBox.style.display = "block";
        return;
      }

      resultsBox.innerHTML = "";
      matches.forEach(item => {
        const row = document.createElement("div");
        row.className = "search-result-row";
        row.innerHTML = `
          <span><strong>${item.name}</strong> <span style="font-size:0.8rem; color:var(--muted);">(${item.slot} - Lvl ${item.reqLvl || 1})</span></span>
          <span style="color:var(--accent); font-size:0.85rem;">Equip ➔</span>
        `;
        row.onclick = () => {
          let targetSlot = item.slot;
          if (item.slot === "Ring") targetSlot = "Ring1";
          if (item.slot === "Trinket") targetSlot = "Trinket1";
          
          equipSlotFromSelect(targetSlot, item.id);
          document.getElementById("global-search").value = "";
          resultsBox.style.display = "none";
        };
        resultsBox.appendChild(row);
      });
      resultsBox.style.display = "block";
    }
