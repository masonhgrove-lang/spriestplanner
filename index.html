<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WoW: Forever - Shadow Priest Armory</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #141414;
      --card: #1f1f1f;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #e8e8e8;
      --muted: #888;
      --border: #333;
      --success: #4ade80;
      --epic: #a335ee;
      --rare: #0070dd;
      --uncommon: #1eff00;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { color: var(--accent); margin: 0 0 5px 0; }
    
    .app-container {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      align-items: start;
    }

    /* Character Screen UI */
    .char-sheet {
      background: #1a1a1a border-box;
      border: 2px solid #3c3c3c;
      border-radius: 8px;
      padding: 20px;
      position: relative;
      display: grid;
      grid-template-columns: 46px 1fr 46px;
      grid-template-rows: auto 50px;
      gap: 15px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    .char-left { grid-column: 1; display: flex; flex-direction: column; gap: 8px; }
    .char-right { grid-column: 3; display: flex; flex-direction: column; gap: 8px; }
    .char-bottom { grid-column: 1 / 4; grid-row: 2; display: flex; justify-content: center; gap: 15px; }
    .char-center {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 10px;
    }

    .stat-row { display: flex; justify-content: space-between; width: 80%; border-bottom: 1px solid #333; padding: 4px 0; font-size: 0.9rem; }
    .stat-label { color: var(--muted); }
    .stat-val { font-weight: bold; color: #fff; }

    /* Gear Slots */
    .gear-slot {
      width: 46px;
      height: 46px;
      background-color: #222;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      background-size: cover;
      transition: border-color 0.2s;
    }
    .gear-slot:hover { border-color: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .gear-slot.active { border-color: var(--success); box-shadow: 0 0 8px var(--success); }
    .slot-icon { width: 100%; height: 100%; border-radius: 3px; }

    /* Background Default Icons */
    .bg-head { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_head.jpg'); }
    .bg-neck { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_neck.jpg'); }
    .bg-shoulder { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_shoulder.jpg'); }
    .bg-back { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_chest.jpg'); }
    .bg-chest { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_chest.jpg'); }
    .bg-wrist { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_wrists.jpg'); }
    .bg-hands { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_hands.jpg'); }
    .bg-waist { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_waist.jpg'); }
    .bg-legs { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_legs.jpg'); }
    .bg-feet { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_feet.jpg'); }
    .bg-ring { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_finger.jpg'); }
    .bg-trinket { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_trinket.jpg'); }
    .bg-mainhand { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_mainhand.jpg'); }
    .bg-offhand { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_offhand.jpg'); }
    .bg-wand { background-image: url('https://wow.zamimg.com/images/wow/icons/large/inventoryslot_ranged.jpg'); }

    /* Upgrades Panel */
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .panel h2 { margin-top: 0; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    .upgrade-list { display: flex; flex-direction: column; gap: 10px; }
    .upgrade-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .upgrade-card.immediate { border-left: 4px solid var(--success); background: #1a221a; }
    .item-title { font-weight: bold; font-size: 1.05rem; }
    .item-sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .ep-gain { color: var(--success); font-weight: bold; font-size: 0.9rem; }
    
    button { background: var(--accent); border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: var(--accent-hover); }

    /* Search Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      width: 90%; max-width: 500px; padding: 20px; max-height: 80vh; display: flex; flex-direction: column;
    }
    .modal input { width: 100%; padding: 10px; background: #111; border: 1px solid var(--accent); color: white; border-radius: 4px; margin-bottom: 12px; }
    .modal-results { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .search-row { display: flex; justify-content: space-between; padding: 10px; background: #222; border-radius: 4px; align-items: center; }
    .search-row:hover { background: #333; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
  <script>const whTooltips = { colorLinks: true, iconizeLinks: true, renameLinks: true };</script>
  <script src="https://wow.zamimg.com/js/tooltips.js"></script>
</head>
<body>
  <header>
    <h1>Shadow Priest Armory</h1>
    <p style="color: var(--muted); margin:0;">Click any slot on your character sheet to assign gear and find upgrades.</p>
  </header>

  <div class="app-container">
    <!-- In-Game Style Character Sheet -->
    <div class="char-sheet">
      <div class="char-left">
        <div id="slot-Head" class="gear-slot bg-head" onclick="openSlot('Head', 'Head')" title="Head"></div>
        <div id="slot-Neck" class="gear-slot bg-neck" onclick="openSlot('Neck', 'Neck')" title="Neck"></div>
        <div id="slot-Shoulder" class="gear-slot bg-shoulder" onclick="openSlot('Shoulder', 'Shoulder')" title="Shoulder"></div>
        <div id="slot-Back" class="gear-slot bg-back" onclick="openSlot('Back', 'Back')" title="Back"></div>
        <div id="slot-Chest" class="gear-slot bg-chest" onclick="openSlot('Chest', 'Chest')" title="Chest"></div>
        <div id="slot-Wrist" class="gear-slot bg-wrist" onclick="openSlot('Wrist', 'Wrist')" title="Wrist"></div>
      </div>
      
      <div class="char-center" id="char-stats">
        <!-- Stats populated by JS -->
      </div>

      <div class="char-right">
        <div id="slot-Hands" class="gear-slot bg-hands" onclick="openSlot('Hands', 'Hands')" title="Hands"></div>
        <div id="slot-Waist" class="gear-slot bg-waist" onclick="openSlot('Waist', 'Waist')" title="Waist"></div>
        <div id="slot-Legs" class="gear-slot bg-legs" onclick="openSlot('Legs', 'Legs')" title="Legs"></div>
        <div id="slot-Feet" class="gear-slot bg-feet" onclick="openSlot('Feet', 'Feet')" title="Feet"></div>
        <div id="slot-Ring1" class="gear-slot bg-ring" onclick="openSlot('Ring1', 'Ring')" title="Ring 1"></div>
        <div id="slot-Ring2" class="gear-slot bg-ring" onclick="openSlot('Ring2', 'Ring')" title="Ring 2"></div>
        <div id="slot-Trinket1" class="gear-slot bg-trinket" onclick="openSlot('Trinket1', 'Trinket')" title="Trinket 1"></div>
        <div id="slot-Trinket2" class="gear-slot bg-trinket" onclick="openSlot('Trinket2', 'Trinket')" title="Trinket 2"></div>
      </div>

      <div class="char-bottom">
        <div id="slot-MainHand" class="gear-slot bg-mainhand" onclick="openSlot('MainHand', 'MainHand')" title="Main Hand"></div>
        <div id="slot-OffHand" class="gear-slot bg-offhand" onclick="openSlot('OffHand', 'OffHand')" title="Off Hand"></div>
        <div id="slot-Wand" class="gear-slot bg-wand" onclick="openSlot('Wand', 'Wand')" title="Wand / Ranged"></div>
      </div>
    </div>

    <!-- Upgrade Advisor -->
    <div class="panel">
      <h2 id="advisor-title">Upgrade Advisor</h2>
      <div id="advisor-content" class="upgrade-list">
        <p style="color:var(--muted);">Select a gear slot on the left to see the best available upgrades for that slot.</p>
      </div>
    </div>
  </div>

  <!-- Search Modal -->
  <div id="search-modal" class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3 id="modal-title" style="margin-top:0; color:var(--accent);">Equip Item</h3>
      <input type="text" id="search-box" placeholder="Search database by item name..." oninput="handleSearch()">
      <div id="search-results" class="modal-results"></div>
      <button style="margin-top: 15px; background: #444;" onclick="unequipCurrent()">Unequip Slot</button>
    </div>
  </div>

  <script>
    const GEAR_HIT_CAP = 12;
    let activeSlot = null;
    let activeBaseSlot = null;

    // LOCAL DATABASE. To add "all" Wowhead items, you paste the expanded JSON list here.
    const ITEMS = [
      { id: 14111, name: "Felcloth Hood", slot: "Head", icon: "inv_helmet_14", reqLvl: 57, source: "Tailoring", stats: { sp: 30 } },
      { id: 16923, name: "Halo of Transcendence", slot: "Head", icon: "inv_helmet_09", reqLvl: 60, source: "Onyxia", stats: { sp: 32, crit: 1, int: 27, spi: 16 } },
      { id: 19375, name: "Mish'undare, Circlet of the Mind Flayer", slot: "Head", icon: "inv_helmet_54", reqLvl: 60, source: "BWL - Nefarian", stats: { sp: 35, crit: 2, int: 24, spi: 9 } },
      { id: 18814, name: "Choker of the Fire Lord", slot: "Neck", icon: "inv_jewelry_necklace_12", reqLvl: 60, source: "Molten Core", stats: { sp: 34, int: 7 } },
      { id: 19370, name: "Mantle of the Blackwing Cabal", slot: "Shoulder", icon: "inv_shoulder_24", reqLvl: 60, source: "BWL - Razorgore", stats: { sp: 34, int: 16 } },
      { id: 19682, name: "Bloodvine Vest", slot: "Chest", icon: "inv_chest_cloth_16", reqLvl: 60, source: "Tailoring", stats: { sp: 27, hit: 2, int: 13 } },
      { id: 19147, name: "Ring of Spell Power", slot: "Ring", icon: "inv_jewelry_ring_40", reqLvl: 60, source: "Molten Core", stats: { sp: 33 } },
      { id: 19379, name: "Neltharion's Tear", slot: "Trinket", icon: "inv_trinket_01", reqLvl: 60, source: "BWL", stats: { sp: 44, hit: 2 } },
      { id: 18842, name: "Staff of Dominance", slot: "MainHand", icon: "inv_staff_13", reqLvl: 60, source: "Molten Core", stats: { sp: 40, crit: 1, int: 16, spi: 14 } },
      { id: 19355, name: "Shadow Flame", slot: "MainHand", icon: "inv_staff_33", reqLvl: 60, source: "BWL", stats: { sp: 84, crit: 2 } }
    ];

    let equipped = JSON.parse(localStorage.getItem("spriest_char_sheet")) || {};

    function getIconUrl(iconName) {
      return iconName ? `https://wow.zamimg.com/images/wow/icons/large/${iconName}.jpg` : '';
    }

    function computeStats() {
      let sp = 0, hit = 0, crit = 0, int = 0, spi = 0;
      Object.values(equipped).forEach(id => {
        const item = ITEMS.find(i => i.id === id);
        if (item && item.stats) {
          sp += item.stats.sp || 0; hit += item.stats.hit || 0; crit += item.stats.crit || 0;
          int += item.stats.int || 0; spi += item.stats.spi || 0;
        }
      });
      return { sp, hit, crit, int, spi };
    }

    function calculateEP(item, currentTotalHit, equippedItemHit = 0) {
      if (!item || !item.stats) return 0;
      const effectiveHit = Math.max(0, Math.min(item.stats.hit || 0, GEAR_HIT_CAP - (currentTotalHit - equippedItemHit)));
      return ((item.stats.sp || 0) * 1.0) + (effectiveHit * 1.15) + ((item.stats.crit || 0) * 0.85) + ((item.stats.int || 0) * 0.25);
    }

    function renderSheet() {
      const stats = computeStats();
      document.getElementById("char-stats").innerHTML = `
        <div style="font-size:1.1rem; color:var(--accent); margin-bottom:10px; font-weight:bold;">Character Stats</div>
        <div class="stat-row"><span class="stat-label">Spell Power</span><span class="stat-val">+${stats.sp}</span></div>
        <div class="stat-row"><span class="stat-label">Spell Hit</span><span class="stat-val" style="color:${stats.hit>=GEAR_HIT_CAP?'var(--success)':'#fff'}">${stats.hit}% / ${GEAR_HIT_CAP}%</span></div>
        <div class="stat-row"><span class="stat-label">Spell Crit</span><span class="stat-val">${stats.crit}%</span></div>
        <div class="stat-row"><span class="stat-label">Intellect</span><span class="stat-val">${stats.int}</span></div>
        <div class="stat-row"><span class="stat-label" style="border:none;">Spirit</span><span class="stat-val" style="border:none;">${stats.spi}</span></div>
      `;

      // Render items in slots
      document.querySelectorAll(".gear-slot").forEach(el => {
        const slotKey = el.id.replace("slot-", "");
        const itemId = equipped[slotKey];
        const item = ITEMS.find(i => i.id === itemId);
        el.classList.remove("active");
        
        if (slotKey === activeSlot) el.classList.add("active");

        if (item && item.icon) {
          el.innerHTML = `<img src="${getIconUrl(item.icon)}" class="slot-icon" data-wowhead="item=${item.id}">`;
        } else {
          el.innerHTML = ``; // Reverts to CSS background fallback
        }
      });
      if (window.$WowheadPower) window.$WowheadPower.refreshLinks();
    }

    function openSlot(slotKey, baseSlot) {
      activeSlot = slotKey;
      activeBaseSlot = baseSlot;
      renderSheet();
      renderUpgrades();
      
      document.getElementById("modal-title").innerText = `Equip ${slotKey}`;
      document.getElementById("search-box").value = "";
      document.getElementById("search-modal").style.display = "flex";
      handleSearch(); // load initial list for this slot
      document.getElementById("search-box").focus();
    }

    function closeModal() {
      document.getElementById("search-modal").style.display = "none";
    }

    function handleSearch() {
      const q = document.getElementById("search-box").value.toLowerCase();
      const container = document.getElementById("search-results");
      container.innerHTML = "";

      const matches = ITEMS.filter(i => i.slot === activeBaseSlot && i.name.toLowerCase().includes(q));
      
      if(matches.length === 0) {
        container.innerHTML = `<p style="color:var(--muted); text-align:center;">No items found in local database.</p>`;
        return;
      }

      matches.forEach(item => {
        const row = document.createElement("div");
        row.className = "search-row";
        row.innerHTML = `
          <div>
            <a href="https://www.wowhead.com/classic/item=${item.id}" data-wowhead="item=${item.id}" style="color:var(--epic); font-weight:bold;">${item.name}</a>
            <div style="font-size:0.8rem; color:var(--muted);">Lvl ${item.reqLvl || 1} • ${item.source}</div>
          </div>
          <button onclick="equipItem(${item.id})">Equip</button>
        `;
        container.appendChild(row);
      });
      if (window.$WowheadPower) window.$WowheadPower.refreshLinks();
    }

    function equipItem(id) {
      equipped[activeSlot] = id;
      localStorage.setItem("spriest_char_sheet", JSON.stringify(equipped));
      closeModal();
      renderSheet();
      renderUpgrades();
    }

    function unequipCurrent() {
      delete equipped[activeSlot];
      localStorage.setItem("spriest_char_sheet", JSON.stringify(equipped));
      closeModal();
      renderSheet();
      renderUpgrades();
    }

    function renderUpgrades() {
      if (!activeSlot) return;
      const stats = computeStats();
      const currentItem = ITEMS.find(i => i.id === equipped[activeSlot]);
      const currentEP = currentItem ? calculateEP(currentItem, stats.hit, currentItem.stats?.hit || 0) : 0;
      
      const container = document.getElementById("advisor-content");
      document.getElementById("advisor-title").innerText = `Upgrades for ${activeSlot}`;
      container.innerHTML = "";

      const upgrades = ITEMS
        .filter(i => i.slot === activeBaseSlot && i.id !== (currentItem ? currentItem.id : null))
        .map(i => {
          const ep = calculateEP(i, stats.hit, currentItem ? currentItem.stats?.hit || 0 : 0);
          return { ...i, ep, delta: ep - currentEP };
        })
        .filter(i => i.delta > 0)
        .sort((a, b) => a.delta - b.delta);

      if (upgrades.length === 0) {
        container.innerHTML = `<p style="color:var(--muted);">No stronger items found in local database for this slot.</p>`;
        return;
      }

      upgrades.forEach((u, index) => {
        const row = document.createElement("div");
        row.className = `upgrade-card ${index === 0 ? 'immediate' : ''}`;
        row.innerHTML = `
          <div>
            ${index === 0 ? `<div style="font-size:0.75rem; color:var(--success); font-weight:bold; margin-bottom:4px;">🎯 CLOSEST UPGRADE</div>` : ''}
            <a href="https://www.wowhead.com/classic/item=${u.id}" data-wowhead="item=${u.id}" class="item-title" style="color:var(--epic);">${u.name}</a>
            <div class="item-sub">${u.source}</div>
            <div class="ep-gain">+${u.delta.toFixed(1)} EP</div>
          </div>
          <button onclick="equipItem(${u.id})">Equip</button>
        `;
        container.appendChild(row);
      });
      if (window.$WowheadPower) window.$WowheadPower.refreshLinks();
    }

    renderSheet();
  </script>
</body>
</html>
